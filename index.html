<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивный химический симулятор</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333;
      --error-bg: #f8d7da;
      --error-text: #721c24;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      max-width: 800px;
    }

    h1 {
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #666;
      font-size: 1.1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    input, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .buttons-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    #buildBtn { background-color: #2ecc71; color: white; }
    #compareBtn { background-color: #34495e; color: white; }
    #molesBtn { background-color: #9b59b6; color: white; }
    #predictBtn { background-color: var(--accent-color); color: white; }
    #randomBtn { background-color: #e67e22; color: white; }
    #clearBtn { background-color: #95a5a6; color: white; }

    button:hover {
      opacity: 0.9;
    }

    /* Стили для холста / визуализатора */
    #canvas-container {
      width: 100%;
      height: 300px;
      background: #1e1e1e;
      border-radius: 8px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-style: italic;
    }

    /* Стили таблиц результатов из вашего скрипта */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }

    th {
      background-color: var(--primary-color);
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .error {
      background-color: var(--error-bg);
      color: var(--error-text);
      padding: 15px;
      border-radius: 6px;
      border-left: 5px solid #dc3545;
      margin-top: 20px;
    }

    .description {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #666;
      line-height: 1.5;
      background: #f1f2f6;
      padding: 15px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Интерактивный химический анализатор</h1>
    <p class="subtitle">Инструмент для визуализации молекул, расчёта количества вещества и интеллектуального прогнозирования химических свойств.</p>
  </header>

  <div class="container">
    
    <!-- Панель управления (Инпуты) -->
    <div class="controls-grid">
      <div class="input-group">
        <label for="inp">Формула молекулы:</label>
        <input type="text" id="inp" placeholder="Например: C2H5OH, CH3COOH, HCHO">
      </div>
      
      <div class="input-group">
        <label for="compareInp">Вторая формула (для сравнения):</label>
        <input type="text" id="compareInp" placeholder="Например: CH3OH">
      </div>

      <div class="input-group">
        <label for="massInp">Масса вещества (г):</label>
        <input type="number" id="massInp" placeholder="0.00" step="0.01">
      </div>

      <div class="input-group">
        <label for="mode">Режим отображения:</label>
        <select id="mode">
          <option value="2d">2D Структура</option>
          <option value="3d">3D Модель (упрощенная)</option>
        </select>
      </div>
    </div>

    <!-- Кнопки действий -->
    <div class="buttons-container">
      <button id="buildBtn">Построить молекулу</button>
      <button id="compareBtn">Сравнить молекулы</button>
      <button id="molesBtn">Расчёт молей</button>
      <button id="predictBtn">Интеллектуальный анализ</button>
      <button id="randomBtn">Случайная молекула</button>
      <button id="clearBtn">Очистить всё</button>
    </div>

    <!-- Область визуализации -->
    <div id="canvas-container">
      <!-- Здесь ваша функция drawMolecule будет рисовать на canvas или в блоке -->
      <div id="visualizer-placeholder">Область визуализации структуры молекулы</div>
    </div>

    <!-- Блок вывода динамических таблиц и результатов анализа -->
    <div id="info"></div>

  </div>

  <!-- JavaScript блок (ваша логика + заглушки для внешних функций) -->
  <script>
    // --- Заглушки для функций и баз данных, которые находятся в первой (невидимой) части вашего проекта ---
    // Это необходимо, чтобы код не выдавал ошибок при нажатии кнопок
    const MOLECULES = {
      "C2H5OH": { name: "Этанол", trivialName: "Этиловый спирт", iupacName: "Этанол", type: "Спирты", geometry: "Тетраэдрическая у кислорода и углеродов", angle: "109.5° / 104.5°", polarity: "Полярная", hybrid: "sp3", bonds: "Одинарные C-C, C-O, C-H, O-H", desc: "Обладает наркотическим действием, растворитель.", bondsData: [[0,1,1]], special: "" },
      "CH3COOH": { name: "Уксусная кислота", trivialName: "Уксусная кислота", iupacName: "Этановая кислота", type: "Карбоновые кислоты", geometry: "Плоская / тетраэдрическая", angle: "120° / 109.5°", polarity: "Высокополярная", hybrid: "sp2 / sp3", bonds: "Одинарные и двойная C=O", desc: "Слабая кислота, консервант.", bondsData: [[0,1,2]], special: "" },
      "HCHO": { name: "Формальдегид", trivialName: "Муравьиный альдегид", iupacName: "Метаналь", type: "Альдегиды", geometry: "Плоская треугольная", angle: "120°", polarity: "Полярная", hybrid: "sp2", bonds: "Двойная связь C=O", desc: "Токсичный газ, консервант анатомических моделей.", bondsData: [[0,1,2]], special: "" }
    };

    function normalizeFormula(f) { return f ? f.trim() : ""; }
    function molarMass(f) { return f === "C2H5OH" ? 46.07 : f === "CH3COOH" ? 60.05 : f === "HCHO" ? 30.03 : 40.0; }
    function compositionText(f) { return "C, H, O"; }
    function parseFormula(f) { return { C: f.includes("C")?2:0, H: f.includes("H")?5:0, O: f.includes("O")?1:0, N: 0, S: 0 }; }
    function drawBackgroundGrid() { const p = document.getElementById("visualizer-placeholder"); if(p) p.innerText = "Сетка очищена. Готов к работе."; }
    function drawMolecule(mol) { const p = document.getElementById("visualizer-placeholder"); if(p) p.innerText = "Визуализация молекулы: " + (mol ? mol.name : "Неизвестно"); }
    function initChips() { console.log("Интерфейс инициализирован"); }
    
    // Вспомогательная заглушка для функции сравнения молекул, так как на первом скрине виден её конец
    function compareMolecules() {
      const f1 = normalizeFormula(inp.value);
      const f2 = normalizeFormula(compareInp.value);
      const m1 = MOLECULES[f1];
      const m2 = MOLECULES[f2];
      if (!m1 || !m2) { info.innerHTML = "<div class='error'>Для сравнения введите обе корректные формулы (например, C2H5OH и CH3COOH)</div>"; return; }
      
      // Вывод таблицы сравнения (начало восстановлено по логике кода на Скриншоте 1)
      info.innerHTML = `
        <table>
        <tr><th>Свойство</th><th>${m1.name} (${f1})</th><th>${m2.name} (${f2})</th></tr>
        <tr><td>Тривиальное название</td><td>${m1.trivialName}</td><td>${m2.trivialName}</td></tr>
        <tr><td>Название по ИЮПАК</td><td>${m1.iupacName}</td><td>${m2.iupacName}</td></tr>
        <tr><td>Тип</td><td>${m1.type}</td><td>${m2.type}</td></tr>
        <tr><td>Геометрия</td><td>${m1.geometry}</td><td>${m2.geometry}</td></tr>
        <tr><td>Углы</td><td>${m1.angle}</td><td>${m2.angle}</td></tr>
        <tr><td>Полярность</td><td>${m1.polarity}</td><td>${m2.polarity}</td></tr>
        <tr><td>Гибридизация</td><td>${m1.hybrid}</td><td>${m2.hybrid}</td></tr>
        <tr><td>Связи</td><td>${m1.bonds}</td><td>${m2.bonds}</td></tr>
        <tr><td>Молярная масса</td><td>${molarMass(f1).toFixed(2)} г/моль</td><td>${molarMass(f2).toFixed(2)} г/моль</td></tr>
        <tr><td>Состав</td><td>${compositionText(f1)}</td><td>${compositionText(f2)}</td></tr>
        <tr><td>Научный вывод</td><td>${m1.desc}</td><td>${m2.desc}</td></tr>
        </table>
      `;
    }

    // --- ССЫЛКИ НА ЭЛЕМЕНТЫ ИНТЕРФЕЙСА ---
    const inp = document.getElementById("inp");
    const compareInp = document.getElementById("compareInp");
    const massInp = document.getElementById("massInp");
    const mode = document.getElementById("mode");
    const info = document.getElementById("info");

    function build() {
      const formula = normalizeFormula(inp.value);
      const mol = MOLECULES[formula];
      if(mol) { drawMolecule(mol); info.innerHTML = `<div style="padding: 10px; background: #e8f5e9;">Молекула ${mol.name} успешно построена! Нажмите "Интеллектуальный анализ" для подробностей.</div>`; }
      else { info.innerHTML = "<div class='error'>Молекула не найдена в учебной базе. Попробуйте C2H5OH, CH3COOH или HCHO</div>"; }
    }


    // =========================================================================
    // НАЧАЛО ВАШЕГО КОДА ИЗ СКРИНШОТОВ (Скриншоты 2 - 8)
    // =========================================================================

    function calculateMoles() {
      const formula = normalizeFormula(inp.value);
      const mol = MOLECULES[formula];
      const mass = Number(massInp.value);

      if (!mol) {
        info.innerHTML = `<div class="error">
        <b>Ошибка расчёта:</b> сначала введите поддерживаемую формулу.</div>`;
        return;
      }

      if (!mass || mass <= 0) {
        info.innerHTML = `<div class="error">
        <b>Ошибка расчёта:</b> введите массу вещества в граммах больше нуля.</div>`;
        return;
      }

      const M = molarMass(formula);
      const n = mass / M;

      drawMolecule(mol);

      info.innerHTML = `
        <table>
          <tr><th>Величина</th><th>Значение</th></tr>
          <tr><td>Формула вещества</td><td>${formula}</td></tr>
          <tr><td>Название</td><td>${mol.name}</td></tr>
          <tr><td>Масса m</td><td>${mass.toFixed(2)} г</td></tr>
          <tr><td>Молярная масса M</td><td>${M.toFixed(2)} г/моль</td></tr>
          <tr><td>Формула расчёта</td><td>n = m / M</td></tr>
          <tr><td>Количество вещества n</td><td><b>${n.toFixed(4)} моль</b></td></tr>
        </table>
      `;
    }

    function hasBondOrder(mol, order) {
      if (!mol.bondsData) return false;
      return mol.bondsData.some(b => b[2] === order);
    }

    function predictProperties() {
      const formula = normalizeFormula(inp.value);
      const mol = MOLECULES[formula];

      if (!mol) {
        info.innerHTML = `<div class="error">
        <b>Ошибка интеллектуального анализа:</b> сначала выберите поддерживаемую молекулу.</div>`;
        return;
      }

      const composition = parseFormula(formula);
      const hasC = composition.C > 0;
      const hasH = composition.H > 0;
      const hasO = composition.O > 0;
      const hasN = composition.N > 0;
      const hasS = composition.S > 0;

      const doubleBond = hasBondOrder(mol, 2) || 
        mol.bonds.includes("двой") || 
        mol.bonds.includes("=");
      
      const tripleBond = hasBondOrder(mol, 3) || 
        mol.bonds.includes("трой") || 
        mol.bonds.includes("≡");
      
      const aromatic = mol.special === "benzene" || 
        mol.special === "toluene" || 
        mol.type.includes("аромат");

      let functionalGroup = "не выражена или не задана для простой модели";
      let hydrogenBonds = "маловероятны";
      let reactivity = "умеренная";
      let explanation = [];

      if (formula === "C2H5OH" || formula === "CH3OH") {
        functionalGroup = "гидроксильная группа -OH";
        hydrogenBonds = "возможны";
        reactivity = "характерны реакции спиртов";
        explanation.push("наличие группы -OH повышает полярность и позволяет образовывать водородные связи");
      } else if (formula === "CH3COOH" || formula === "HCOOH") {
        functionalGroup = "карбоксильная группа -COOH";
        hydrogenBonds = "возможны";
        reactivity = "кислотные свойства";
        explanation.push("карбоксильная группа определяет кислотные свойства вещества");
      } else if (formula === "HCHO") {
        functionalGroup = "карбонильная группа C=O, альдегидная группа";
        hydrogenBonds = "как донор — нет, как акцептор — возможны";
        reactivity = "повышенная, характерны реакции альдегидов";
        explanation.push("двойная связь C=O делает молекулу полярной и реакционноспособной");
      } else if (aromatic) {
        functionalGroup = "ароматическое бензольное кольцо";
        hydrogenBonds = "маловероятны";
        reactivity = "характерны реакции замещения в ароматическом кольце";
        explanation.push("делокализация п-электронов стабилизирует ароматическую систему");
      } else if (tripleBond) {
        functionalGroup = "тройная связь";
        hydrogenBonds = "маловероятны";
        reactivity = "характерны реакции присоединения";
        explanation.push("тройная связь делает молекулу более реакционноспособной по сравнению с алканами");
      } else if (doubleBond) {
        functionalGroup = "двойная связь";
        hydrogenBonds = "маловероятны";
        reactivity = "характерны реакции присоединения";
        explanation.push("двойная связь указывает на ненасыщенный характер молекулы");
      } else if (hasO && hasH && !hasC) {
        functionalGroup = "полярные связи с кислородом";
        hydrogenBonds = "возможны при наличии O-H";
        explanation.push("кислород повышает полярность молекулы");
      } else if (hasC && hasH && !hasO && !hasN && !hasS) {
        functionalGroup = "углеводородный скелет";
        hydrogenBonds = "маловероятны";
        reactivity = "относительно низкая";
        explanation.push("молекула состоит из C и H, поэтому относится к углеводородам");
      }

      if (doubleBond) explanation.push("обнаружены двойные связи");
      if (tripleBond) explanation.push("обнаружены тройные связи");
      if (mol.polarity.includes("поляр")) {
        explanation.push("учтена полярность: " + mol.polarity);
      }

      const M = molarMass(formula);
      drawMolecule(mol);

      info.innerHTML = `
        <table>
          <tr><th>Параметр</th><th>Предсказание / результат</th></tr>
          <tr><td>Формула</td><td>${formula}</td></tr>
          <tr><td>Название</td><td>${mol.name}</td></tr>
          <tr><td>Тривиальное название</td><td>${mol.trivialName}</td></tr>
          <tr><td>Название по ИЮПАК</td><td>${mol.iupacName}</td></tr>
          <tr><td>Предполагаемый класс</td><td>${mol.type}</td></tr>
          <tr><td>Функциональная группа / структурный признак</td><td>${functionalGroup}</td></tr>
          <tr><td>Предсказанная полярность</td><td>${mol.polarity}</td></tr>
          <tr><td>Геометрия</td><td>${mol.geometry}</td></tr>
          <tr><td>Кратные связи</td><td>${doubleBond ? "есть двойные связи" : "двойные связи не обнаружены"}; ${tripleBond ? "есть тройные связи" : "тройные связи не обнаружены"}</td></tr>
          <tr><td>Водородные связи</td><td>${hydrogenBonds}</td></tr>
          <tr><td>Оценка реакционной способности</td><td>${reactivity}</td></tr>
          <tr><td>Молярная масса</td><td>${M.toFixed(2)} г/моль</td></tr>
          <tr><td>Уверенность алгоритма</td><td>высокая для учебной базы</td></tr>
          <tr><td>Объяснение</td><td>${explanation.join("; ") || "использованы данные из базы молекул и состава вещества"}</td></tr>
        </table>
        <p class="description">
          Этот блок является прототипом интеллектуального анализа. Он использует химические признаки молекулы: состав, типы связей, функциональные группы и данные из учебной базы. В дальнейшем его можно заменить нейросетевой моделью.
        </p>
      `;
    }

    function clearAll() {
      drawBackgroundGrid();
      info.innerHTML = "";
    }

    function randomMolecule() {
      const keys = Object.keys(MOLECULES);
      const random = keys[Math.floor(Math.random() * keys.length)];
      inp.value = random;
      build();
    }

    document.getElementById("buildBtn").onclick = build;
    document.getElementById("compareBtn").onclick = compareMolecules;
    document.getElementById("molesBtn").onclick = calculateMoles;
    document.getElementById("predictBtn").onclick = predictProperties;
    document.getElementById("randomBtn").onclick = randomMolecule;
    document.getElementById("clearBtn").onclick = clearAll;

    inp.addEventListener("keydown", function(e) {
      if (e.key === "Enter") build();
    });

    compareInp.addEventListener("keydown", function(e) {
      if (e.key === "Enter") compareMolecules();
    });

    massInp.addEventListener("keydown", function(e) {
      if (e.key === "Enter") calculateMoles();
    });

    mode.addEventListener("change", function() {
      if (inp.value.trim() !== "") build();
    });

    initChips();
    clearAll();
  </script>

</body>
</html>
