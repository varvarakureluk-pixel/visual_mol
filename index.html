function normalizeFormula(value) {
  return value.trim().toUpperCase().replace(/\s+/g,"");
}

function formatSymbol(s) {
  if (s === "CL") return "Cl";
  return s;
}

function parseFormula(formula) {
  const result = {};
  const re = /(CL|[A-Z])(\d*)/g;
  let match;

  while ((match = re.exec(formula)) !== null) {
    const element = match[1];
    const count = match[2] ? Number(match[2]) : 1;
    result[element] = (result[element] || 0) + count;
  }

  return result;
}

function molarMass(formula) {
  const composition = parseFormula(formula);
  let total = 0;

  for (const element in composition) {
    total += (atomicMass[element] || 0) * composition[element];
  }

  return total;
}

function compositionText(formula) {
  const composition = parseFormula(formula);

  return Object.entries(composition)
    .map(([element, count]) => `${formatSymbol(element)}: ${count}`)
    .join(", ");
}

function drawBackground() {
  ctx.clearRect(0,0,c.width,c.height);

  ctx.strokeStyle = "rgba(148,163,184,0.08)";
  ctx.lineWidth = 1;

  for (let x = 0; x <= c.width; x += 50) {
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,c.height);
    ctx.stroke();
  }

  for (let y = 0; y <= c.height; y += 50) {
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(c.width,y);
    ctx.stroke();
  }
}

function line(x1,y1,x2,y2) {
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

function drawBond(x1,y1,x2,y2,order) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx,dy);
  const nx = -dy / len;
  const ny = dx / len;

  ctx.strokeStyle = "rgba(255,255,255,0.9)";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";

  if (order === 1) {
    line(x1,y1,x2,y2);
  }

  if (order === 2) {
    ctx.lineWidth = 3;
    line(x1 + nx*6, y1 + ny*6, x2 + nx*6, y2 + ny*6);
    line(x1 - nx*6, y1 - ny*6, x2 - nx*6, y2 - ny*6);
  }

  if (order === 3) {
    ctx.lineWidth = 3;
    line(x1,y1,x2,y2);
    line(x1 + nx*9, y1 + ny*9, x2 + nx*9, y2 + ny*9);
    line(x1 - nx*9, y1 - ny*9, x2 - nx*9, y2 - ny*9);
  }
}

function drawAtom(symbol,x,y) {
  const color = colors[symbol] || "#38bdf8";
  const radius = symbol.length > 1 ? 25 : 22;

  ctx.beginPath();
  ctx.arc(x+4,y+5,radius,0,Math.PI*2);
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fill();

  const grad = ctx.createRadialGradient(
    x - 8, y - 8, 3,
    x, y, radius
  );

  grad.addColorStop(0, "rgba(255,255,255,0.95)");
  grad.addColorStop(0.28, color);
  grad.addColorStop(1, "rgba(15,23,42,0.9)");

  ctx.beginPath();
  ctx.arc(x,y,radius,0,Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x - 7, y - 8, 5, 0, Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.font = symbol.length > 1 ? "bold 13px Arial" : "bold 15px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(formatSymbol(symbol),x,y);
}

function drawPair(x,y,ox,oy) {
  ctx.fillStyle = "#7dd3fc";

  ctx.beginPath();
  ctx.arc(x + ox - 5, y + oy, 3, 0, Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x + ox + 5, y + oy, 3, 0, Math.PI*2);
  ctx.fill();
}

function drawAromaticCircle(cx,cy,r) {
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 3;
  ctx.setLineDash([8,8]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawBenzene(withMethyl) {
  const cx = 450;
  const cy = 250;
  const r = 120;
  const pts = [];

  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3;
    pts.push([
      cx + Math.cos(a) * r,
      cy + Math.sin(a) * r
    ]);
  }

  for (let i = 0; i < 6; i++) {
    drawBond(
      pts[i][0],
      pts[i][1],
      pts[(i+1)%6][0],
      pts[(i+1)%6][1],
      1
    );
  }

  drawAromaticCircle(cx,cy,67);

  for (let i = 0; i < 6; i++) {
    drawAtom("C",pts[i][0],pts[i][1]);
  }

  if (withMethyl) {
    const ch3 = [cx + r + 95, cy];
    drawBond(pts[0][0],pts[0][1],ch3[0],ch3[1],1);
    drawAtom("C",ch3[0],ch3[1]);

    ctx.fillStyle = "white";
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "center";
    ctx.fillText("CH₃",ch3[0],ch3[1] + 38);
  } else {
    for (let i = 0; i < 6; i++) {
      const hx = pts[i][0] + (pts[i][0] - cx) * 0.42;
      const hy = pts[i][1] + (pts[i][1] - cy) * 0.42;

      drawBond(pts[i][0],pts[i][1],hx,hy,1);
      drawAtom("H",hx,hy);
    }
  }
}

function drawMolecule(mol) {
  drawBackground();

  if (mol.special === "benzene") {
    drawBenzene(false);
    return;
  }

  if (mol.special === "toluene") {
    drawBenzene(true);
    return;
  }

  for (const b of mol.bonds) {
    const a1 = mol.atoms[b[0]];
    const a2 = mol.atoms[b[1]];
    drawBond(a1[1],a1[2],a2[1],a2[2],b[2]);
  }

  for (const a of mol.atoms) {
    drawAtom(a[0],a[1],a[2]);
  }

  if (mode.value === "electron") {
    for (const p of mol.pairs) {
      const atom = mol.atoms[p[0]];
      drawPair(atom[1],atom[2],p[1],p[2]);
    }
  }
}

function renderInfo(formula,mol) {
  info.innerHTML = `
    <table>
      <tr><th>Свойство</th><th>Значение</th></tr>
      <tr><td>Формула</td><td>${formula}</td></tr>
      <tr><td>Название</td><td>${mol.name}</td></tr>
      <tr><td>Тривиальное название</td><td>${mol.trivialName}</td></tr>
      <tr><td>Название по ИЮПАК</td><td>${mol.iupacName}</td></tr>
      <tr><td>Тип</td><td>${mol.type}</td></tr>
      <tr><td>Геометрия</td><td>${mol.geometry}</td></tr>
      <tr><td>Углы</td><td>${mol.angle}</td></tr>
      <tr><td>Полярность</td><td>${mol.polarity}</td></tr>
      <tr><td>Гибридизация</td><td>${mol.hybrid}</td></tr>
      <tr><td>Связи</td><td>${mol.bondsText}</td></tr>
      <tr><td>Молярная масса</td><td>${molarMass(formula).toFixed(2)} г/моль</td></tr>
      <tr><td>Состав</td><td>${compositionText(formula)}</td></tr>
      <tr><td>Описание</td><td>${mol.desc}</td></tr>
    </table>
  `;
}

function build() {
  const formula = normalizeFormula(inp.value);
  const mol = molecules[formula];

  if (!mol) {
    drawBackground();

    ctx.fillStyle = "white";
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Молекула пока не поддерживается",450,235);

    ctx.font = "16px Arial";
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText("Выберите формулу из выпадающего списка или быстрых кнопок",450,270);

    info.innerHTML = `
      <table>
        <tr><th>Ошибка</th></tr>
        <tr><td>Такой формулы пока нет в базе данных.</td></tr>
      </table>
    `;
    return;
  }

  drawMolecule(mol);
  renderInfo(formula,mol);
}

function compareMolecules() {
  const f1 = normalizeFormula(inp.value);
  const f2 = normalizeFormula(compareInp.value);
  const m1 = molecules[f1];
  const m2 = molecules[f2];

  if (!m1 || !m2) {
    info.innerHTML = `
      <table>
        <tr><th>Ошибка сравнения</th></tr>
        <tr><td>Введите две поддерживаемые формулы, например H2O и CO2.</td></tr>
      </table>
    `;
    return;
  }

  drawMolecule(m1);

  info.innerHTML = `
    <table>
      <tr><th>Свойство</th><th>${f1} — ${m1.name}</th><th>${f2} — ${m2.name}</th></tr>
      <tr><td>Тривиальное название</td><td>${m1.trivialName}</td><td>${m2.trivialName}</td></tr>
      <tr><td>Название по ИЮПАК</td><td>${m1.iupacName}</td><td>${m2.iupacName}</td></tr>
      <tr><td>Тип</td><td>${m1.type}</td><td>${m2.type}</td></tr>
      <tr><td>Геометрия</td><td>${m1.geometry}</td><td>${m2.geometry}</td></tr>
      <tr><td>Углы</td><td>${m1.angle}</td><td>${m2.angle}</td></tr>
      <tr><td>Полярность</td><td>${m1.polarity}</td><td>${m2.polarity}</td></tr>
      <tr><td>Гибридизация</td><td>${m1.hybrid}</td><td>${m2.hybrid}</td></tr>
      <tr><td>Связи</td><td>${m1.bondsText}</td><td>${m2.bondsText}</td></tr>
      <tr><td>Молярная масса</td><td>${molarMass(f1).toFixed(2)} г/моль</td><td>${molarMass(f2).toFixed(2)} г/моль</td></tr>
      <tr><td>Состав</td><td>${compositionText(f1)}</td><td>${compositionText(f2)}</td></tr>
      <tr><td>Научный вывод</td><td>${m1.desc}</td><td>${m2.desc}</td></tr>
    </table>
  `;
}

function calculateMoles() {
  const formula = normalizeFormula(inp.value);
  const mol = molecules[formula];
  const mass = Number(massInp.value);

  if (!mol) {
    info.innerHTML = `
      <table>
        <tr><th>Ошибка расчёта</th></tr>
        <tr><td>Сначала введите поддерживаемую формулу в первое поле.</td></tr>
      </table>
    `;
    return;
  }

  if (!mass || mass <= 0) {
    info.innerHTML = `
      <table>
        <tr><th>Ошибка расчёта</th></tr>
        <tr><td>Введите массу вещества в граммах больше нуля.</td></tr>
      </table>
    `;
    return;
  }

  const M = molarMass(formula);
  const n = mass / M;

  drawMolecule(mol);

  info.innerHTML = `
    <table>
      <tr><th>Величина</th><th>Значение</th></tr>
      <tr><td>Формула вещества</td><td>${formula}</td></tr>
      <tr><td>Название</td><td>${mol.name}</td></tr>
      <tr><td>Тривиальное название</td><td>${mol.trivialName}</td></tr>
      <tr><td>Название по ИЮПАК</td><td>${mol.iupacName}</td></tr>
      <tr><td>Масса m</td><td>${mass.toFixed(2)} г</td></tr>
      <tr><td>Молярная масса M</td><td>${M.toFixed(2)} г/моль</td></tr>
      <tr><td>Формула расчёта</td><td>n = m / M</td></tr>
      <tr><td>Количество вещества n</td><td><b>${n.toFixed(4)} моль</b></td></tr>
    </table>
  `;
}

function clearAll() {
  drawBackground();
  info.innerHTML = "";
}

function randomMolecule() {
  const keys = Object.keys(molecules);
  const random = keys[Math.floor(Math.random() * keys.length)];
  inp.value = random;
  build();
}

function makeQuickButtonsAndList() {
  const keys = Object.keys(molecules);

  for (const key of keys) {
    const mol = molecules[key];

    const option = document.createElement("option");
    option.value = key;
    option.label = key + " — " + mol.name + " — " + mol.iupacName;
    moleculeList.appendChild(option);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = key;
    btn.title = mol.name + "; " + mol.iupacName;

    btn.onclick = function() {
      inp.value = key;
      build();
    };

    quick.appendChild(btn);
  }
}

document.getElementById("buildBtn").onclick = build;
document.getElementById("compareBtn").onclick = compareMolecules;
document.getElementById("molesBtn").onclick = calculateMoles;
document.getElementById("randomBtn").onclick = randomMolecule;
document.getElementById("clearBtn").onclick = clearAll;

inp.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    build();
  }
});

compareInp.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    compareMolecules();
  }
});

massInp.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    calculateMoles();
  }
});

mode.addEventListener("change", function() {
  if (inp.value.trim() !== "") {
    build();
  }
});

makeQuickButtonsAndList();
clearAll();
</script>

</body>
</html>
